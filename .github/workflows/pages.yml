name: Deploy Brain Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up regression runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify mapping preservation and paper workflow
        run: |
          node scripts/validate-evidence-policy.mjs
          node scripts/validate-persistence.mjs
          node scripts/validate-research.mjs
          node scripts/validate-enrichment.mjs
          node scripts/validate-networks.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
