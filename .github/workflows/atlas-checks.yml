name: Verify atlas search and hierarchy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: atlas-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all atlas and research regressions
        run: |
          set -eu
          for script in scripts/validate-*.mjs; do node "$script"; done
      - name: Install disposable browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise search, hierarchy, preservation and real renderer
        env:
          REQUIRE_WEBGL: '1'
        run: python scripts/validate-discovery-browser.py
      - name: Exercise structure notes and upward links
        run: python scripts/validate-notes-browser.py
      - name: Exercise real geometry associations and negative controls
        run: python scripts/validate-geometry-browser.py
      - name: Exercise opaque surfaces, automatic isolation and recovery
        run: python scripts/validate-render-mode-browser.py
